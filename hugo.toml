baseURL = 'https://lushanjun1127.github.io/blog/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-cn'
title = '陆山君的博客'
theme = 'PaperMod'

[params]
  description = '个人博客'
  author = '陆山君'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[params.homeInfoParams]
  Title = '你好，我是陆山君'
  Content = '这里记录我的学习与思考。'

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/lushanjun1127'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 40
