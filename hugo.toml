# ============================================
# 站点基础配置
# ============================================
baseURL = 'https://lushanjun1127.github.io/blog/'
title = '陆山君的博客'
theme = 'reimu'
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
hasCJKLanguage = true

# 生成 robots.txt，利于搜索引擎收录
enableRobotsTXT = true

# 生成 sitemap.xml
enableSitemap = true

# 自动从 Git 提交记录读取最后修改时间
# 开启后 front matter 里的 lastmod 可省略，主题会用 .Lastmod
enableGitInfo = true

# ============================================
# 多语言配置
# ============================================
[languages]
  [languages.zh-CN]
    label = '简体中文'
    weight = 1
    hasCJKLanguage = true

# ============================================
# 输出格式
# ============================================
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

# ============================================
# Markdown 渲染
# ============================================
[markup]
  # 代码高亮：使用 CSS class，配合主题样式
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false

  # Goldmark 渲染器
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许 Markdown 中写原始 HTML（如 <div>、<iframe> 等）
      # 若主题或文章里需要嵌入 HTML，开启它
      unsafe = true

  # 目录（TOC）配置
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# ============================================
# 分页
# ============================================
[pagination]
  pagerSize = 10

# ============================================
# 站点级参数（供主题读取，按 Reimu 文档调整）
# ============================================
[params]
  # description = '记录学习与生活'
  # author = '陆山君'
  # 主题专属参数请参考 Reimu 文档添加
